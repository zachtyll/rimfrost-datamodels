plugins {
    alias libs.plugins.jandex
    // TODO: is groovy necessary?, i will paste earlier comment below:
    // Apply the groovy plugin to also add support for Groovy (needed for Spock)
    id 'groovy'
    // Adds the 'publish' task which is used to push to java.repo
    id 'maven-publish'
}

group = 'se.fk.mimer'
version = '2.0.2'

jar {
    manifest {
        attributes 'Implementation-Version': "${version}"
    }
}

dependencies {
    implementation libs.jakartaee.api
    implementation libs.jackson.databind
    implementation libs.jackson.datatype
    implementation libs.jackson.core
    implementation libs.jackson.jdk8
    implementation libs.java.uuid.generator

    compileOnly libs.lombok
    annotationProcessor( libs.lombok )
    testCompileOnly libs.lombok
    testAnnotationProcessor( libs.lombok )

    testImplementation platform( libs.junit.bom )
    testImplementation libs.junit.jupiter

    testImplementation libs.hibernate.validator
    testImplementation libs.glassfish.expressly
    testImplementation platform( libs.mockito.bom )
    testImplementation libs.mockito
}

publishing {
    publications {
        lib(MavenPublication) {
            artifactId = "${artifact}"
            version = "${version}"

            from components.java
        }
    }

    repositories {
        maven {
            url = uploadURLReleases
            credentials {
                username uploadUser
                password uploadPassword
            }
        }
    }
}